map $http_origin $dafy_foreign_origin {
    default 1;
    "" 0;
    "https://@PUBLIC_HOST@" 0;
}

map "$request_method:$dafy_foreign_origin" $dafy_reject_write {
    default 0;
    "POST:1" 1;
}

server {
    listen 80;
    server_name @PUBLIC_HOST@;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dafy-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://@PUBLIC_HOST@$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name @PUBLIC_HOST@;
    ssl_certificate /etc/letsencrypt/live/dafy-panel/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dafy-panel/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DAFY_TLS:1m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-store always;
    client_max_body_size 2m;

    location / {
        auth_basic off;

        if ($dafy_reject_write) { return 403; }

        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }
}
